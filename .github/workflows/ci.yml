name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node-version:
          - 22
          - 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/vite/package-lock.json
            test/fixtures/next/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: test/fixtures/vite
      - run: npm run build
        working-directory: test/fixtures/vite
      - run: npm ci
        working-directory: test/fixtures/next
      - run: npm run build
        working-directory: test/fixtures/next
